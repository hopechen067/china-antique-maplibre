display_name: "China Antique MapLibre"
default_prompt: |
  Use the china-antique-maplibre skill: configurable raster basemap (off by
  default) + Terrarium hillshade (encoding terrarium), full China water overlay,
  antique CSS grade, and tiered city extrusions. Prefer tuner
  preset-antique-default.json, export JSON, migrate into HyperFrames. Configure
  tiles only via map-tiles.config.js / map-tiles.config.local.js with endpoints
  the user is allowed to use. Use jumpTo + idle (no easeTo/flyTo). Do not host
  final render on the tuner. Follow references/*.md for parameters, layer order,
  and water/city schemas. Water data is not MIT — see DATA-PROVENANCE.md.
