# Deploy the MapLibre tuner as a static site on GitHub Pages.
# Live URL: https://<owner>.github.io/<repo>/
name: Deploy tuner (GitHub Pages)

on:
  push:
    branches: [master, main]
    paths:
      - "china-antique-maplibre/tuner/**"
      - "showcases/hexi-ep07/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site root
        run: |
          set -euo pipefail
          mkdir -p _site
          # Publish only the tuner static assets (relative paths stay valid)
          rsync -a \
            --exclude '_serve.*' \
            --exclude '_preview*' \
            --exclude 'verify.mjs' \
            --exclude 'map-tiles.config.local.js' \
            --exclude '.DS_Store' \
            china-antique-maplibre/tuner/ _site/
          # Demo clip for README / site embed (served as video/mp4, not raw attachment)
          mkdir -p _site/media
          if [ -f showcases/hexi-ep07/hexi-ep07-demo-480p.mp4 ]; then
            cp -f showcases/hexi-ep07/hexi-ep07-demo-480p.mp4 _site/media/
          fi
          # Prevent Jekyll from ignoring underscore paths
          touch _site/.nojekyll
          # Small marker for debugging deploys
          date -u +"%Y-%m-%dT%H:%M:%SZ" > _site/DEPLOYED_AT.txt
          # Water overlay is required for the public demo (not MIT — see LICENSE-EXCEPTIONS.md)
          if [ ! -f _site/assets/water-data.js ]; then
            echo "::error::Missing _site/assets/water-data.js — demo water overlay would fail"
            exit 1
          fi
          water_bytes=$(wc -c < _site/assets/water-data.js)
          echo "water-data.js bytes=${water_bytes}"
          if [ "${water_bytes}" -lt 1000000 ]; then
            echo "::error::water-data.js looks truncated (${water_bytes} bytes)"
            exit 1
          fi
          if ! grep -q 'CHINA_WATER_DATA' _site/assets/water-data.js; then
            echo "::error::water-data.js does not define CHINA_WATER_DATA"
            exit 1
          fi
          ls -la _site _site/assets _site/media | head -60

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
